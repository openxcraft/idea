matrix_rules:
  single_value_axes: [platform, software_class, solution_category, architecture, scale, language, stack, layer, novelty_axis]
  multi_value_axes: [threat_model]
  threat_model_min_items: 1
  privacy_claiming_categories: [security, privacy, anonymity, censorship_resistance]
  novelty_axis_values: [platform, class, category, architecture, threat_model, combination]
  from_scratch:
    must_be_true_by_default: true
    dependency_cap: 1
    dependency_must_be: "a general-purpose runtime, language, or toolchain — never the idea's substance"
