# ============================================================
# Cross-Domain Diversity Generator — controlled vocabularies
# (addendum deliverable 1). Extends tags/taxonomy.yaml.
# Every idea must carry exactly one value from each single-
# value matrix, and >= 1 value from threat_model. The queen
# must not draw more than diversity.max_share_per_value of a
# run's ideas from any single value in any matrix (with the
# balanced_relaxation rule for small matrices, see config.yaml).
# ============================================================

